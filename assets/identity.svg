<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Lucca Romano — Software Developer</title>
  <desc id="desc">Building, breaking and rebuilding. Code, design, innovation and impact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#05070d"/><stop offset=".55" stop-color="#0b1020"/><stop offset="1" stop-color="#11152c"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e2a48" stroke-width="1" opacity=".42"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="url(#grid)" stroke="#263653" stroke-width="2"/>
  <path d="M0 286H1200" stroke="url(#line)" stroke-width="2" opacity=".8"><animate attributeName="y1" values="286;300;286" dur="5s" repeatCount="indefinite"/><animate attributeName="y2" values="286;300;286" dur="5s" repeatCount="indefinite"/></path>
  <circle cx="1010" cy="110" r="84" fill="none" stroke="#00e5ff" stroke-opacity=".13" stroke-width="2"/><circle cx="1010" cy="110" r="55" fill="none" stroke="#8b5cf6" stroke-opacity=".2" stroke-width="1" stroke-dasharray="5 12"><animateTransform attributeName="transform" type="rotate" from="0 1010 110" to="360 1010 110" dur="18s" repeatCount="indefinite"/></circle>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><text x="74" y="70" fill="#00e5ff" font-size="14" letter-spacing="4">/ PROFILE_INTERFACE / 2026</text><text x="72" y="176" fill="#f8fafc" font-size="76" font-weight="800" letter-spacing="8">LC</text><text x="210" y="150" fill="#f8fafc" font-size="35" font-weight="700" letter-spacing="3">LUCCA ROMANO</text><text x="212" y="184" fill="#8fa6c9" font-size="17" letter-spacing="3">SOFTWARE DEVELOPER · INNOVATION ENTHUSIAST</text><text x="212" y="216" fill="#8fa6c9" font-size="17" letter-spacing="3">HACKATHON BUILDER</text><text x="74" y="270" fill="#00e5ff" font-size="19" letter-spacing="3">BUILDING · BREAKING · REBUILDING</text><g fill="#a8b8d6" font-size="12" letter-spacing="2"><text x="74" y="323">[ CODE ]</text><text x="205" y="323">[ DESIGN ]</text><text x="354" y="323">[ INNOVATION ]</text><text x="560" y="323">[ IMPACT ]</text></g><text x="1058" y="294" fill="#8b5cf6" font-size="12" text-anchor="middle">SYSTEM ONLINE</text></g>
  <circle cx="1135" cy="42" r="5" fill="#00e5ff" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
</svg>
